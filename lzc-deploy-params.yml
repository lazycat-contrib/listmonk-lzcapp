params:
  - id: admin_user
    type: string
    name: "Admin Username"
    description: "Username of the super admin account created on first start"
    default_value: "admin"
    optional: false
  - id: admin_password
    type: secret
    name: "Admin Password"
    description: "Password of the super admin account created on first start"
    default_value: "$random(len=20)"
    optional: false

locales:
  zh:
    admin_user:
      name: "管理员用户名"
      description: "首次启动时自动创建的超管账号用户名"
    admin_password:
      name: "管理员密码"
      description: "首次启动时自动创建的超管账号密码，部署时自动生成"
