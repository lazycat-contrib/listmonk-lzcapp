application:
  subdomain: listmonk
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://listmonk-app:9000/
  injects:
    # The super admin account is created on first start; fill it in so the
    # user does not have to type it.
    - id: login-autofill
      when:
        - /admin/login
      do:
        - src: builtin://simple-inject-password
          params:
            user: "{{ .U.admin_user }}"
            password: "{{ .U.admin_password }}"
services:
  listmonk-app:
    # listmonk/listmonk:v6.2.0
    # upstream: docker.io/listmonk/listmonk:v6.2.0
    image: docker.1ms.run/listmonk/listmonk:v6.2.0
    environment:
      - LISTMONK_app__address=0.0.0.0:9000
      - LISTMONK_db__user=listmonk
      - LISTMONK_db__password={{ stable_secret "listmonk_db_password" }}
      - LISTMONK_db__database=listmonk
      - LISTMONK_db__host=db
      - LISTMONK_db__port=5432
      - LISTMONK_db__ssl_mode=disable
      - LISTMONK_db__max_open=25
      - LISTMONK_db__max_idle=25
      - LISTMONK_db__max_lifetime=300s
      - TZ=Asia/Shanghai
      - LISTMONK_ADMIN_USER={{ .U.admin_user }}
      - LISTMONK_ADMIN_PASSWORD={{ .U.admin_password }}
    # Install the schema on an empty database and migrate it on upgrades.
    command: 'sh -c "./listmonk --install --idempotent --yes --config && ./listmonk --upgrade --yes --config && ./listmonk --config"'
    binds:
      - /lzcapp/var/uploads:/listmonk/uploads
    depends_on:
      - db
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=listmonk
      - POSTGRES_PASSWORD={{ stable_secret "listmonk_db_password" }}
      - POSTGRES_DB=listmonk
    binds:
      - /lzcapp/var/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U listmonk
      interval: 10s
      timeout: 5s
      retries: 6
